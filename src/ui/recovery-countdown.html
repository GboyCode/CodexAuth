<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>CodexAuth 自动切换确认</title>
    <link rel="stylesheet" href="./recovery-countdown.css" />
  </head>
  <body>
    <main aria-labelledby="title">
      <header><span class="brand">CodexAuth · 自动恢复</span><button id="closeBtn" aria-label="取消本次并关闭">×</button></header>
      <div class="headline"><span class="warning" aria-hidden="true">!</span><h1 id="title">即将切换账号</h1><strong class="timer"><span id="seconds">15</span><small> 秒</small></strong></div>
      <p class="target-caption">切换到</p>
      <p id="targetAccount" class="target">正在读取账号…</p>
      <p id="taskSummary" class="summary">将重启 Codex，并在原任务发送继续指令。</p>
      <button id="cancelBtn" class="cancel">取消本次</button>
      <p class="footnote">取消后不再重试本次中断，自动恢复开关保持开启。</p>
    </main>
    <script src="./recovery-countdown.js"></script>
  </body>
</html>
