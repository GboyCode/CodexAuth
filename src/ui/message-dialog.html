<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>CodexAuth</title>
    <link rel="stylesheet" href="./theme.css" />
    <link rel="stylesheet" href="./message-dialog.css" />
  </head>
  <body>
    <main class="confirm-dialog" role="dialog" aria-modal="true" aria-labelledby="message" aria-describedby="detail">
      <header>
        <img src="./assets/codex-monochrome.svg" alt="" />
        <span id="title">CodexAuth</span>
        <button id="closeBtn" class="close-btn" type="button" aria-label="关闭">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="m4 4 8 8M12 4l-8 8" /></svg>
        </button>
      </header>
      <section class="message-copy">
        <h1 id="message"></h1>
        <p id="detail"></p>
      </section>
      <footer id="actions" class="dialog-actions"></footer>
    </main>
    <script src="./message-dialog.js"></script>
  </body>
</html>
