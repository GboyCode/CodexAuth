name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run lint && npm run platform:validate && npm run codex-config:validate && npm run usage:validate && npm run local-data:validate && npm run browser-cache:validate && npm run startup:validate && npm run portable:validate && npm run updates:validate

      - name: Build installer
        run: npm run pack:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            release/CodexAuthSwitch-Setup-*.exe
            release/CodexAuthSwitch-Setup-*.exe.blockmap

  build-macos:
    name: Build macOS installers
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run lint && npm run platform:validate && npm run codex-config:validate && npm run usage:validate && npm run local-data:validate && npm run browser-cache:validate && npm run startup:validate && npm run portable:validate && npm run updates:validate

      - name: Build Intel and Apple Silicon DMGs
        run: npm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          if-no-files-found: error
          path: release/*.dmg*

  publish-release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CodexAuth Switch ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-assets/**
