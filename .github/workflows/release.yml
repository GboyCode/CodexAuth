name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-config:
    name: Select release platforms
    runs-on: ubuntu-latest
    outputs:
      windows: ${{ steps.platforms.outputs.windows }}
      macos: ${{ steps.platforms.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
      - id: platforms
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const tag = process.env.GITHUB_REF_NAME;
          if (!/^v\d+\.\d+\.\d+$/.test(tag)) throw new Error('Invalid release tag');
          const file = `docs/releases/${tag}.json`;
          const platforms = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file, 'utf8')).platforms : ['windows', 'macos'];
          if (!Array.isArray(platforms) || !platforms.length || platforms.some(p => !['windows', 'macos'].includes(p))) throw new Error('Invalid release platforms');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `windows=${platforms.includes('windows')}\nmacos=${platforms.includes('macos')}\n`);
          NODE

  build-windows:
    needs: release-config
    if: needs.release-config.outputs.windows == 'true'
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run lint && npm run platform:validate && npm run codex-config:validate && npm run usage:validate && npm run local-data:validate && npm run browser-cache:validate && npm run startup:validate && npm run portable:validate && npm run updates:validate && npm run auto-recovery:validate && npm run account-login:validate && npm run account-safety:validate && npm run subscription:validate

      - name: Validate icon rendering at 100% and 200% scale
        run: npm run icon:validate

      - name: Build installer
        run: npm run pack:win

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: error
          path: |
            release/CodexAuthSwitch-Setup-*.exe
            release/CodexAuthSwitch-Setup-*.exe.blockmap

  build-macos:
    needs: release-config
    if: needs.release-config.outputs.macos == 'true'
    name: Build macOS installers
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run lint && npm run platform:validate && npm run codex-config:validate && npm run usage:validate && npm run local-data:validate && npm run browser-cache:validate && npm run startup:validate && npm run portable:validate && npm run updates:validate && npm run auto-recovery:validate && npm run account-login:validate && npm run account-safety:validate && npm run subscription:validate

      - name: Validate icon rendering at 100% and 200% scale
        run: npm run icon:validate

      - name: Validate macOS switcher behavior
        run: npm run macos:validate

      - name: Build Intel and Apple Silicon DMGs
        # Icon Composer assets need Xcode 26+; electron-builder checks its version.
        # Resolve the selected Xcode's tool instead of relying on a PATH shim.
        shell: bash
        run: |
          export PATH="$(dirname "$(xcrun --find actool)"):$PATH"
          npm run pack:mac
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload macOS installers
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          if-no-files-found: error
          path: release/*.dmg*

      - name: Upload compiled icon previews
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-icon-previews
          path: release/**/icon-verification/*.png
          if-no-files-found: warn

      - name: Upload macOS panel preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-panel-preview
          path: |
            output/playwright/panel/mac-menu-bar.png
            output/playwright/panel/mac-native-validation.json
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    if: always() && needs.release-config.result == 'success' && (needs.build-windows.result == 'success' || needs.build-windows.result == 'skipped') && (needs.build-macos.result == 'success' || needs.build-macos.result == 'skipped')
    needs:
      - release-config
      - build-windows
      - build-macos
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release notes
        uses: actions/checkout@v4

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: '*-installer*'
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CodexAuth Switch ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-assets/**
